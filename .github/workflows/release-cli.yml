name: Release CLI

on:
  push:
    tags: ["cli-v*"]

# Independent of deploy.yml on purpose: the gateway ships on every push to
# main, the CLI ships when a tag says so. Tagging after the merge has deployed
# is what keeps a protocol bump from reaching users before the gateway has it.
concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing. Without it there is no OIDC token
      # to exchange and npm falls back to asking for credentials nobody set.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Both runtimes: bun installs and builds as everywhere else in this repo,
      # npm publishes. Trusted publishing needs npm 11.5.1+, which is newer
      # than what ships with Node 22, hence the explicit upgrade. Provenance
      # needs a public repository and the same OIDC token.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use an npm that can publish with OIDC
        run: npm install -g npm@latest

      # npm refuses to reuse a version, so a tag that disagrees with
      # package.json is a mistake that cannot be corrected by retagging.
      - name: Check the tag matches the package version
        run: |
          tagged="${GITHUB_REF_NAME#cli-v}"
          declared="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$tagged" != "$declared" ]; then
            echo "Tag $GITHUB_REF_NAME says $tagged, packages/cli/package.json says $declared." >&2
            exit 1
          fi

      # The gateway tells every connecting executor which CLI is newest, from a
      # var in wrangler.jsonc. A release that forgets to bump it ships a CLI
      # that then reports itself outdated forever, so a stable tag must agree
      # with the var. Prereleases are exempt: they should not be advertised as
      # latest, so they must not require the var to point at them.
      - name: Check the gateway advertises this version
        run: |
          version="${GITHUB_REF_NAME#cli-v}"
          if [[ "$version" == *-* ]]; then
            echo "Prerelease $version: skipping the LATEST_CLI_VERSION check."
            exit 0
          fi
          advertised="$(
            node -e "
              const line = require('fs').readFileSync('apps/gateway/wrangler.jsonc', 'utf8')
                .split('\n').find((l) => l.includes('LATEST_CLI_VERSION'));
              console.log(line.match(/\"[0-9]+\.[0-9]+\.[0-9]+[^\"]*\"/)[0].replaceAll('\"', ''));
            "
          )"
          if [ "$version" != "$advertised" ]; then
            echo "Tag $GITHUB_REF_NAME says $version, but apps/gateway/wrangler.jsonc advertises $advertised." >&2
            echo "Bump LATEST_CLI_VERSION on main, let it deploy, then retag." >&2
            exit 1
          fi

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run --cwd packages/cli build

      - name: Publish
        run: npm publish --provenance --access public
        working-directory: packages/cli

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      # Publishing to npm only needed to read the repo; creating a release
      # writes to it.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#cli-v}"
          args=(--generate-notes --title "CLI $version")
          # A semver prerelease (0.3.0-beta.1) carries a hyphen; mark it so
          # it does not show up as "latest" over the stable release.
          if [[ "$version" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}"
