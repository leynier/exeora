name: Release CLI

on:
  push:
    tags: ["cli-v*"]

# Independent of deploy.yml on purpose: the gateway ships on every push to
# main, the CLI ships when a tag says so. Tagging after the merge has deployed
# is what keeps a protocol bump from reaching users before the gateway has it.
concurrency:
  group: release-cli
  cancel-in-progress: false

# The default for every job here, including the `check` call into ci.yml. The
# two jobs that need more than reading say so themselves.
permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build-native:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.31 is Ubuntu 20.04 LTS. Linking on ubuntu-latest (2.39)
          # would refuse to start on 20.04 and 22.04.
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
            glibc: "2.31"
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: ""
            glibc: "2.31"
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            suffix: ""
          - runner: macos-15
            target: aarch64-apple-darwin
            suffix: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # GitHub-hosted macOS images pre-tap aws/tap. Homebrew 6 requires
      # explicit trust for third-party taps, so every brew call — including
      # `brew install bash` inside setup-rust-toolchain — annotates the job.
      # We do not use that tap; drop it before any brew call.
      - name: Untap unused Homebrew aws/tap
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: brew untap --force aws/tap || true

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Zig
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        env:
          CARGO_ZIGBUILD_VERSION: "0.23.3"
        run: |
          case "$(uname -m)" in
            x86_64)
              zigbuild_target=x86_64-unknown-linux-gnu
              zigbuild_sha256=fbdbcf6f72d5c5676b897c67d3690df8319be2e1164d2af487c6be771070a1f9
              ;;
            aarch64)
              zigbuild_target=aarch64-unknown-linux-gnu
              zigbuild_sha256=364c5843f9c0cc7de620642832a6a5fba7a5e3cf825602e444c08eefb57b0391
              ;;
            *)
              echo "Unsupported host for cargo-zigbuild: $(uname -m)" >&2
              exit 1
              ;;
          esac
          asset="cargo-zigbuild-${zigbuild_target}.tar.xz"
          archive="${RUNNER_TEMP:-/tmp}/$asset"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$archive" \
            "https://github.com/rust-cross/cargo-zigbuild/releases/download/v${CARGO_ZIGBUILD_VERSION}/$asset"
          printf '%s  %s\n' "$zigbuild_sha256" "$archive" | sha256sum -c -
          mkdir -p "$HOME/.cargo/bin"
          tar -xJf "$archive" --strip-components=1 -C "$HOME/.cargo/bin" \
            "cargo-zigbuild-${zigbuild_target}/cargo-zigbuild"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo zigbuild --version

      - name: Build native executable
        if: runner.os != 'Linux'
        run: cargo build --locked --release -p exeora-cli --target ${{ matrix.target }}

      - name: Build Linux executable against glibc ${{ matrix.glibc }}
        if: runner.os == 'Linux'
        run: cargo zigbuild --locked --release -p exeora-cli --target ${{ matrix.target }}.${{ matrix.glibc }}

      - name: Check Linux glibc requirement
        if: runner.os == 'Linux'
        run: sh scripts/check-linux-glibc.sh "target/${{ matrix.target }}/release/exeora" "${{ matrix.glibc }}"

      - name: Stage executable
        shell: bash
        run: |
          mkdir native
          cp "target/${{ matrix.target }}/release/exeora${{ matrix.suffix }}" "native/exeora-${{ matrix.target }}${{ matrix.suffix }}"

      - uses: actions/upload-artifact@v7
        with:
          name: exeora-${{ matrix.target }}
          path: native/*
          if-no-files-found: error

  publish:
    # crates.io publication cannot be rolled back. Wait for every native target
    # to build before making that irreversible step, so a platform failure does
    # not leave a crate published without a matching binary release.
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # crates.io refuses to reuse a version, so a tag that disagrees with
      # Cargo.toml is a mistake that cannot be corrected by retagging.
      - name: Check the tag matches the package version
        run: |
          tagged="${GITHUB_REF_NAME#cli-v}"
          declared="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$tagged" != "$declared" ]; then
            echo "Tag $GITHUB_REF_NAME says $tagged, but Cargo.toml says $declared." >&2
            exit 1
          fi

      # The gateway tells every connecting executor which CLI is newest, from a
      # var in wrangler.jsonc. A release that forgets to bump it ships a CLI
      # that then reports itself outdated forever, so a stable tag must agree
      # with the var. Prereleases are exempt: they should not be advertised as
      # latest, so they must not require the var to point at them.
      - name: Check the gateway advertises this version
        run: |
          version="${GITHUB_REF_NAME#cli-v}"
          if [[ "$version" == *-* ]]; then
            echo "Prerelease $version: skipping the LATEST_CLI_VERSION check."
            exit 0
          fi
          advertised="$(
            grep 'LATEST_CLI_VERSION' apps/gateway/wrangler.jsonc | head -1 \
              | sed -n 's/.*"\([0-9][0-9.]*[^"]*\)".*/\1/p'
          )"
          if [ "$version" != "$advertised" ]; then
            echo "Tag $GITHUB_REF_NAME says $version, but apps/gateway/wrangler.jsonc advertises $advertised." >&2
            echo "Bump LATEST_CLI_VERSION on main, let it deploy, then retag." >&2
            exit 1
          fi

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Publish Rust crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p exeora-cli

  release:
    needs: [publish, build-native]
    runs-on: ubuntu-latest
    permissions:
      # Checking out the code only needed to read the repo; creating a release
      # writes to it.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: exeora-*
          path: native
          merge-multiple: true

      - name: Write checksums
        run: |
          cd native
          sha256sum exeora-* > checksums-sha256.txt

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#cli-v}"
          args=(--generate-notes --title "CLI $version")
          # A semver prerelease (0.3.0-beta.1) carries a hyphen; mark it so
          # it does not show up as "latest" over the stable release.
          if [[ "$version" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" native/* "${args[@]}"
