name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two Workers share one zone and one database. Overlapping runs could apply a
# migration underneath a deploy, so they are serialised rather than cancelled:
# a half-finished deploy is worse than a slow queue.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # Migrations first: the new code may depend on columns the old schema
      # does not have, and this schema only ever adds.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/gateway
          packageManager: bun
          command: d1 migrations apply exeora --remote

      - name: Deploy gateway
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/gateway
          packageManager: bun
          # Names of the Worker secrets to set, each matching an env var below.
          secrets: |
            GITHUB_CLIENT_ID
            GITHUB_CLIENT_SECRET
            COOKIE_SECRET
        env:
          # GitHub refuses repository secrets whose name starts with GITHUB_,
          # so they are stored under GH_OAUTH_* and renamed here to the names
          # the Worker actually reads.
          GITHUB_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}

      # public/ is generated and git-ignored, so the web Worker has nothing to
      # serve unless both static builds run here.
      - name: Build the landing and dashboard
        run: bun run --cwd apps/web build

      - name: Deploy web
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          packageManager: bun
