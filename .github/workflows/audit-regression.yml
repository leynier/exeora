name: Audit regressions

on:
  pull_request:
    paths:
      - ".github/workflows/audit-regression.yml"
      - "apps/gateway/**"
      - "packages/**"
      - "apps/web/**"
      - "scripts/audit-maintenance/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "bun.lock"

permissions:
  contents: read

concurrency:
  group: audit-regressions-${{ github.ref }}
  cancel-in-progress: true

# Lint, typecheck and the workerd suites already run in ci.yml's `check` job.
jobs:
  maintenance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Test maintenance without production credentials
        run: uv run -p 3.12 python -m unittest discover -s scripts/audit-maintenance -p 'test_*.py'

  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Exercise the existing browser suite
        run: bun run test:e2e
