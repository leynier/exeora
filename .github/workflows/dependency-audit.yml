name: Dependency audit

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Audit JavaScript dependencies
        run: bun audit --audit-level high

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      # Pin the scanner itself so a tool update cannot silently alter the
      # result of a scheduled audit. cargo-audit reports unmaintained crates as
      # warnings and only fails this gate for advisories that affect code.
      - name: Install cargo-audit
        run: cargo install --locked --version 0.22.2 cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit
