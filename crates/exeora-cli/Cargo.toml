[package]
name = "exeora-cli"
description = "Native Exeora CLI and local tool executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "readme.md"
keywords = ["mcp", "ai", "agent", "cli", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "exeora"
path = "src/main.rs"

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.100"
atomic-write-file = "0.3.0"
base64 = "0.22.1"
axum = { version = "0.8.6", default-features = false, features = ["http1", "tokio", "query"] }
cap-std = "4.0.2"
clap = { version = "4.5.51", features = ["derive", "wrap_help"] }
cliclack = "0.5.5"
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
globset = "0.4.18"
grep-matcher = "0.1.8"
grep-searcher = "0.1.17"
hostname = "0.4.1"
ignore = "0.4.25"
jsonschema = { version = "0.49.1", default-features = false }
keepawake = "0.6.0"
keyring = "4.1.5"
memchr = "2.7.6"
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest"] }
open = "5.3.2"
process-wrap = { version = "9.1.0", default-features = false, features = ["tokio1", "kill-on-drop", "process-group", "process-session", "job-object", "creation-flags"] }
portable-pty = "0.9.0"
regex-syntax = "0.8.11"
regress = { version = "0.11.1", features = ["utf16"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "rustls", "system-proxy"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
semver = "1.0.27"
self-replace = "1.5.0"
sha2 = "0.10.9"
similar = { version = "3.0.0", features = ["bytes"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tokio-util = { version = "0.7.17", features = ["rt"] }
toml = "0.9.8"
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4"] }
unicode-normalization = "0.1.24"

[dev-dependencies]
assert_cmd = "2.1.1"
criterion = "0.7.0"
predicates = "3.1.3"
tempfile = "3.23.0"

[[bench]]
name = "tool_dispatch"
harness = false
