<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Exeora</title>
  <rect width="64" height="64" rx="14" fill="#0d0f11" />
  <!--
    Three tiles: one above, two below and apart. A client, the gateway, and the
    machine that does the work, meeting at the corners rather than merging.

    Geometry lives in one place, apps/web/landing/src/components/Wordmark.astro,
    and is repeated here because a favicon cannot import anything: three 24x24
    tiles with a radius of 4, on a pitch of 20 so they overlap by exactly the
    radius and the silhouette closes. Scaled to sit inside the rounded square.
  -->
  <g fill="#f4f5f6" transform="translate(7 14.5) scale(0.78)">
    <rect x="20" y="0" width="24" height="24" rx="4" />
    <rect x="0" y="20" width="24" height="24" rx="4" />
    <rect x="40" y="20" width="24" height="24" rx="4" />
  </g>
</svg>
